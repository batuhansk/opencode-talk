name: Release

# Push a tag like v0.1.0 (matching package.json "version") to publish.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  release:
    runs-on: macos-26
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Check tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - name: Build helper
        run: npm run build

      - name: Test
        run: npm test

      - name: Stage on npm
        # Trusted publishing (OIDC): no token. The version is staged and goes
        # live only after a maintainer approves it on npmjs.com with 2FA/passkey.
        # Skipped if this version is already on npm (e.g. published by hand).
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "opencode-talk@$version" version >/dev/null 2>&1; then
            echo "opencode-talk@$version is already on npm; skipping"
          else
            npm stage publish --provenance --access public --ignore-scripts
            echo "Staged opencode-talk@$version. Approve it at https://www.npmjs.com/package/opencode-talk (Staged Packages) to publish."
          fi

      - name: Create GitHub Release
        run: |
          cp bin/opencode-talk-helper opencode-talk-helper-macos-universal
          notes=$(awk -v v="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## " v { found=1; next }
            found && /^## / { exit }
            found { print }' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" opencode-talk-helper-macos-universal \
            --title "$GITHUB_REF_NAME" --notes "${notes:-See CHANGELOG.md}"
        env:
          GH_TOKEN: ${{ github.token }}
