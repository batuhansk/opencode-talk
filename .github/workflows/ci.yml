name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build helper (Swift 6, warnings as errors)
        run: npm run build
      - name: Test
        # Helper integration tests skip here: CI can't grant speech permission.
        run: npm test
      - name: Check formatting
        run: npx -y prettier@3 --check .
